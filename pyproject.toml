[project]
name = "hr-agent"
version = "0.1.0"
description = "人資規章問答 RAG 系統"
readme = "README.md"
authors = [
    { name = "TzuJuLin", email = "jenny100486l@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15.0",
    "chromadb>=1.5.9",
    "numpy<2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "sentence-transformers<4",
    "torch==2.2.2",
    "transformers<4.50",
]


[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

